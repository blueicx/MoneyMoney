name: MoneyMoney CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run security:scan
      - run: git diff --check
      - run: npm run smoke:web
