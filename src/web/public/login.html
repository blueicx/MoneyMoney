<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - MoneyMoney</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f3f6fb;--bg-card:rgba(255,255,255,.68);--bg-secondary:rgba(255,255,255,.42);--glass-highlight:rgba(255,255,255,.72);--border:rgba(255,255,255,.58);--text:#1a1a2e;--text-secondary:#6b6b80;--purple:#7c3aed;--purple-light:rgba(124,58,237,.12);--purple-dark:#5b21b6;--green:#10b981;--red:#ef4444;--shadow:0 18px 45px rgba(31,38,74,.10);--radius:16px;--transition:all .2s ease}
[data-theme="dark"]{--bg:#060913;--bg-card:rgba(18,23,43,.62);--bg-secondary:rgba(255,255,255,.06);--glass-highlight:rgba(148,176,255,.16);--border:rgba(148,176,255,.16);--text:#e8e8f0;--text-secondary:#a4a9c3;--purple:#9f67ff;--purple-light:rgba(159,103,255,.16);--purple-dark:#c4a8ff;--green:#34d399;--red:#f87171;--shadow:0 24px 60px rgba(0,0,0,.38)}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(58vw 48vh at 8% 4%, color-mix(in srgb, var(--purple) 22%, transparent), transparent 62%),radial-gradient(52vw 42vh at 88% 12%, color-mix(in srgb, #22d3ee 17%, transparent), transparent 65%),radial-gradient(64vw 52vh at 58% 92%, color-mix(in srgb, var(--green) 14%, transparent), transparent 68%),linear-gradient(145deg, color-mix(in srgb, var(--bg) 92%, var(--purple) 8%), var(--bg));background-attachment:fixed;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:linear-gradient(135deg,var(--glass-highlight),var(--bg-card));border:1px solid var(--border);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.16);border-radius:24px;padding:36px 32px;width:100%;max-width:420px}
.logo{font-size:22px;font-weight:800;color:var(--purple);display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo-icon{width:36px;height:36px;background:var(--purple);border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.subtitle{color:var(--text-secondary);font-size:13px;margin-bottom:28px;line-height:1.6}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary);margin:14px 0 8px;display:block}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:color-mix(in srgb, var(--bg-secondary) 78%, var(--bg-card));backdrop-filter:blur(12px);color:var(--text);font-size:14px;outline:none;transition:var(--transition)}
.input:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-light)}
.btn{width:100%;margin-top:22px;padding:12px;border:none;border-radius:12px;background:var(--purple);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:var(--transition);box-shadow:0 8px 20px rgba(124,58,237,.28)}
.btn:hover{background:var(--purple-dark);transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error{margin-top:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb, var(--red) 12%, transparent);border:1px solid color-mix(in srgb, var(--red) 18%, transparent);color:var(--red);font-size:13px;display:none}
.error.show{display:block}
.hint{margin-top:16px;text-align:center;font-size:12px;color:var(--text-secondary);line-height:1.6}
.hint code{background:var(--bg-secondary);padding:2px 6px;border-radius:6px;font-size:12px}
.footer{margin-top:20px;text-align:center;font-size:12px;color:var(--text-secondary)}
.footer a{color:var(--purple);text-decoration:none}
.footer a:hover{text-decoration:underline}
.theme-toggle{position:fixed;top:18px;right:18px;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;color:var(--text-secondary);backdrop-filter:blur(12px)}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap .input{padding-right:44px}
.pw-toggle{position:absolute;right:8px;background:transparent;border:none;cursor:pointer;font-size:16px;color:var(--text-secondary);padding:4px 6px;border-radius:8px}
.pw-toggle:hover{background:var(--bg-secondary)}
.banner{margin-bottom:16px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb, var(--red) 10%, transparent);border:1px solid color-mix(in srgb, var(--red) 16%, transparent);color:var(--red);font-size:12px;line-height:1.6;display:none}
.banner.show{display:block}
.banner.warn{background:color-mix(in srgb, #f59e0b 12%, transparent);border-color:color-mix(in srgb, #f59e0b 18%, transparent);color:#92400e}
[data-theme="dark"] .banner.warn{color:#fbbf24}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button">🌙 深色</button>
<div class="card">
  <div class="logo"><span class="logo-icon">¥</span> MoneyMoney</div>
  <div class="subtitle">多市场交易助手 · 登录后即可进入仪表盘<br>本地优先，登录状态仅保存在本机浏览器</div>
  <div class="banner" id="expiredBanner">登录已过期，请重新登录</div>
  <div class="banner warn" id="defaultBanner">⚠️ 当前使用默认账号 <code>admin / admin123</code>，建议尽快在 <code>.env</code> 中修改</div>
  <form id="loginForm" autocomplete="on">
    <label class="label" for="username">用户名</label>
    <input class="input" id="username" name="username" type="text" placeholder="默认 admin" required autofocus>
    <label class="label" for="password">密码</label>
    <div class="pw-wrap"><input class="input" id="password" name="password" type="password" placeholder="默认 admin123" required><button type="button" class="pw-toggle" id="pwToggle" aria-label="显示密码" title="显示/隐藏密码">👁️</button></div>
    <div class="error" id="errorBox" role="alert" aria-live="polite" tabindex="-1"></div>
    <button class="btn" id="submitBtn" type="submit">登录</button>
  </form>
  <div class="hint">
    默认账号 <code>admin / admin123</code><br>
    可在 <code>.env</code> 中设置 <code>MONEYMONEY_LOGIN_USER</code> / <code>MONEYMONEY_LOGIN_PASS</code>
  </div>
  <div class="footer"><a href="/">← 返回首页</a> · <span id="capsHint" style="display:none;color:var(--red);margin-left:8px">大写锁定已开启</span></div>
</div>
<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const form=$('#loginForm'), user=$('#username'), pass=$('#password'), err=$('#errorBox'), btn=$('#submitBtn');
  const pwToggle=$('#pwToggle'), expiredBanner=$('#expiredBanner'), defaultBanner=$('#defaultBanner');
  // 显示过期提示 / 默认账号提示
  (function(){
    const qs=new URLSearchParams(location.search);
    if(qs.get('reason')==='expired') { expiredBanner.style.display='block'; expiredBanner.classList.add('show'); }
    // 检查是否默认账号
    fetch('/api/auth/status').then(r=>r.json()).then(d=>{
      if(d && d.data && d.data.isDefault) defaultBanner.classList.add('show');
    }).catch(()=>{});
  })();
  if(pwToggle){
    pwToggle.addEventListener('click', ()=>{
      const isPwd = pass.type==='password';
      pass.type = isPwd ? 'text' : 'password';
      pwToggle.textContent = isPwd ? '🙈' : '👁️';
      pwToggle.setAttribute('aria-label', isPwd ? '隐藏密码' : '显示密码');
    });
  }
  const toggle=$('#themeToggle');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const saved = localStorage.getItem('mm-theme');
  const initial = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', initial);
  toggle.textContent = initial==='dark' ? '☀️ 浅色' : '🌙 深色';
  toggle.addEventListener('click', ()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const nxt=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', nxt);
    localStorage.setItem('mm-theme', nxt);
    toggle.textContent = nxt==='dark' ? '☀️ 浅色' : '🌙 深色';
  });
  // 已登录则跳仪表盘
  const token = localStorage.getItem('mm_token');
  if(token){
    fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+token}}).then(r=>{
      if(r.ok){ const qs=new URLSearchParams(location.search); const nxt=qs.get('next'); location.href=nxt ? decodeURIComponent(nxt) : '/'; }
      else if(r.status===401){ localStorage.removeItem('mm_token'); }
    }).catch(()=>{});
  }
  pass.addEventListener('keyup', (e)=>{
    const caps = e.getModifierState && e.getModifierState('CapsLock');
    document.getElementById('capsHint').style.display = caps ? 'inline' : 'none';
  });
  function showError(msg){ err.textContent=msg; err.classList.add('show'); err.setAttribute('role','alert'); err.focus && err.focus(); }
  function clearError(){ err.textContent=''; err.classList.remove('show'); }
  form.addEventListener('submit', async (e)=>{
    e.preventDefault(); clearError();
    const u=user.value.trim(), p=pass.value;
    if(!u){ user.focus(); showError('请输入用户名'); return; }
    if(!p){ pass.focus(); showError('请输入密码'); return; }
    btn.disabled=true; btn.textContent='登录中…';
    try{
      const res= await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p})});
      const data= await res.json().catch(()=>({}));
      if(res.status===429){ const ra=data.retryAfter||60; throw new Error('尝试过于频繁，请 '+ra+' 秒后再试'); }
      if(!res.ok || !data.success){ throw new Error(data.error || '登录失败'); }
      localStorage.setItem('mm_token', data.token);
      localStorage.setItem('mm_user', data.user);
      // 同时写 cookie 便于直接访问受保护资源
      document.cookie = 'mm_token='+encodeURIComponent(data.token)+'; Path=/; SameSite=Lax';
      const next = new URLSearchParams(location.search).get('next') || '/';
      location.href = next;
    }catch(ex){ showError(ex.message || '网络错误'); } finally { btn.disabled=false; btn.textContent='登录'; }
  });
})();
</script>
</body>
</html>
